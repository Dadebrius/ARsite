<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR AR - Плоскость</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-hit-test@0.1.0/dist/aframe-hit-test.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial; }
        #start-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #start-btn:active { transform: translateX(-50%) scale(0.95); }
        #hint {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            display: none;
            z-index: 9999;
        }
    </style>
</head>
<body>
    
    <button id="start-btn">🚀 Запустить AR</button>
    <div id="hint">Наведите на пол и коснитесь экрана</div>

    <a-scene 
        xr-mode-ui="XRMode: ar"
        hit-test="enabled: true;"
        renderer="colorManagement: true; physicallyCorrectLights: true;"
        webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: dom-overlay;">
        
        <a-assets>
            <!-- Стандартная модель A-Frame -->
        </a-assets>
        
        <!-- Освещение -->
        <a-entity light="type: ambient; intensity: 0.6"></a-entity>
        <a-entity light="type: directional; intensity: 0.8" position="1 3 1"></a-entity>
        
        <!-- Камера для AR -->
        <a-camera position="0 1.6 0">
            <!-- Кольцо-прицел -->
            <a-ring 
                position="0 0 -1" 
                radius-inner="0.02" 
                radius-outer="0.03" 
                color="#FFFFFF"
                opacity="0.8">
            </a-ring>
        </a-camera>
        
        <!-- Шаблон модели, которая будет размещена на плоскости -->
        <a-entity id="reticle" 
            geometry="primitive: ring; radiusInner: 0.1; radiusOuter: 0.12"
            material="color: #00FF00; shader: flat"
            visible="false">
            <a-ring 
                rotation="90 0 0"
                radius-inner="0.05" 
                radius-outer="0.07" 
                color="#00FF00" 
                opacity="0.5">
            </a-ring>
        </a-entity>
        
        <!-- Модель, которая появится при клике -->
        <a-entity id="model-container">
            <a-entity 
                id="ar-model"
                position="0 0.3 0"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
                
                <!-- 3D модель - кристалл -->
                <a-octahedron 
                    color="#4ECDC4" 
                    radius="0.3"
                    position="0 0 0">
                </a-octahedron>
                
                <a-cone 
                    color="#FF6B6B" 
                    radius-bottom="0.2" 
                    height="0.5"
                    position="0 0.5 0">
                </a-cone>
                
                <a-torus-knot
                    color="#FFE66D"
                    radius="0.15"
                    radius-tubular="0.05"
                    position="0 -0.4 0">
                </a-torus-knot>
            </a-entity>
        </a-entity>
        
        <!-- WebXR камера -->
        <a-entity id="webxr-camera" camera></a-entity>
    </a-scene>

    <script>
        const scene = document.querySelector('a-scene');
        const startBtn = document.getElementById('start-btn');
        const hint = document.getElementById('hint');
        
        // Проверка поддержки WebXR
        if (navigator.xr && navigator.xr.isSessionSupported) {
            navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                if (!supported) {
                    startBtn.textContent = '❌ AR не поддерживается';
                    startBtn.disabled = true;
                    startBtn.style.background = '#888';
                }
            });
        } else {
            startBtn.textContent = '❌ WebXR не поддерживается';
            startBtn.disabled = true;
            startBtn.style.background = '#888';
        }
        
        // Запуск AR сессии
        startBtn.addEventListener('click', async () => {
            try {
                if (scene.xrSession) {
                    await scene.xrSession.end();
                    return;
                }
                
                const session = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['hit-test', 'local-floor'],
                    optionalFeatures: ['dom-overlay'],
                    domOverlay: { root: document.body }
                });
                
                await scene.renderer.xr.setSession(session);
                scene.xrSession = session;
                
                startBtn.style.display = 'none';
                hint.style.display = 'block';
                
                session.addEventListener('end', () => {
                    startBtn.style.display = 'block';
                    startBtn.textContent = '🚀 Запустить AR';
                    hint.style.display = 'none';
                    scene.xrSession = null;
                });
                
            } catch (error) {
                console.error('Ошибка AR:', error);
                alert('Не удалось запустить AR: ' + error.message);
            }
        });
        
        // Обработка hit-test для размещения модели
        scene.addEventListener('loaded', () => {
            const reticle = document.getElementById('reticle');
            const modelContainer = document.getElementById('model-container');
            let modelPlaced = false;
            
            // Логика размещения модели
            scene.addEventListener('click', () => {
                if (reticle.getAttribute('visible') && !modelPlaced) {
                    const position = reticle.getAttribute('position');
                    modelContainer.setAttribute('position', position);
                    modelPlaced = true;
                    hint.textContent = '✓ Модель размещена!';
                    
                    setTimeout(() => {
                        hint.style.opacity = '0';
                        hint.style.transition = 'opacity 0.5s';
                    }, 2000);
                }
            });
        });
        
    </script>
</body>
</html>

</body>
</html>
