<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Сайт - Модель на плоскости</title>
    
    <!-- Подключаем AR.js и A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            z-index: 1000;
            font-size: 14px;
            max-width: 80%;
        }
        
        #status {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 1000;
            font-size: 14px;
        }
        
        .loading {
            color: #ffcc00;
        }
        
        .success {
            color: #00ff00;
        }
    </style>
</head>
<body>
    
    <div id="info">
        <strong>AR Просмотр</strong><br>
        Наведите камеру на ровную поверхность
    </div>
    
    <div id="status" class="loading">Загрузка камеры...</div>

    <!-- AR.js сцена с маркером Hiro -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: mediump;"
        device-orientation-permission-ui="enabled: false">
        
        <!-- Освещение -->
        <a-assets>
            <!-- Встроенная простая 3D-модель (торус) -->
            <a-asset-item id="model" src="https://cdn.glitch.global/2c0c2e5a-1e7c-4b1f-9c5a-3f8e6d2a4b1c/astronaut.glb"></a-asset-item>
        </a-assets>
        
        <!-- Маркер Hiro - при наведении на него появится модель -->
        <a-marker preset="hiro">
            <!-- Освещение для маркера -->
            <a-entity light="type: ambient; color: #BBB"></a-entity>
            <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="1 2 1"></a-entity>
            
            <!-- 3D модель на плоскости (торус) -->
            <a-entity 
                position="0 0.5 0"
                scale="1 1 1"
                rotation="0 0 0"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
                
                <!-- Вращающийся торус -->
                <a-torus 
                    color="#FF6B6B" 
                    radius="0.5" 
                    radius-tubular="0.15"
                    segments-radial="32"
                    segments-tubular="64">
                </a-torus>
                
                <!-- Дополнительные элементы -->
                <a-cone 
                    color="#4ECDC4" 
                    radius-bottom="0.3" 
                    radius-top="0" 
                    height="0.6"
                    position="0 0.8 0">
                </a-cone>
                
                <a-sphere 
                    color="#FFE66D" 
                    radius="0.2"
                    position="0 -0.8 0">
                </a-sphere>
            </a-entity>
            
            <!-- Текстовый лейбл -->
            <a-text 
                value="AR Модель" 
                color="#FFFFFF" 
                position="0 1.8 0" 
                align="center"
                scale="1 1 1">
            </a-text>
        </a-marker>
        
        <!-- Камера -->
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // Проверка поддержки камеры
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(function(stream) {
                    // Останавливаем тестовый поток, AR.js сам запросит камеру
                    stream.getTracks().forEach(track => track.stop());
                    
                    const status = document.getElementById('status');
                    status.textContent = '✓ Камера готова. Наведите на маркер Hiro';
                    status.className = 'success';
                    
                    setTimeout(() => {
                        status.style.transition = 'opacity 0.5s';
                        status.style.opacity = '0';
                    }, 5000);
                })
                .catch(function(err) {
                    document.getElementById('status').textContent = 
                        '⚠ Ошибка доступа к камере: ' + err.message;
                    document.getElementById('status').className = 'loading';
                });
        } else {
            document.getElementById('status').textContent = 
                '⚠ Ваш браузер не поддерживает доступ к камере';
        }

        // Скрываем загрузочный экран A-Frame
        window.addEventListener('load', function() {
            setTimeout(() => {
                const loader = document.querySelector('.a-loader-title');
                if (loader) loader.style.display = 'none';
            }, 1000);
        });
    </script>
    
</body>
</html>
