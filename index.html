<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR - авторазмещение модели</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        
        #hint {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 12px 22px;
            border-radius: 22px;
            z-index: 9999;
            font-size: 15px;
            display: none;
            pointer-events: none;
            white-space: nowrap;
            transition: opacity 0.5s;
        }

        /* Стилизуем встроенную AR-кнопку A-Frame */
        .a-enter-vr {
            font-family: Arial, sans-serif !important;
        }
    </style>
</head>
<body>
    
    <div id="hint">Наведите камеру на ровную поверхность...</div>

    <!-- 
      ВАЖНО:
      - xr-mode-ui="XRMode: ar"  → A-Frame сам создаёт кнопку "AR"
      - НЕ отключаем xr-mode-ui
      - webxr без dom-overlay (A-Frame сам разрулит)
    -->
    <a-scene
        renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
        xr-mode-ui="XRMode: ar; enabled: true"
        webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: dom-overlay;"
        background="transparent: true">
        
        <!-- Освещение -->
        <a-entity light="type: ambient; intensity: 0.7"></a-entity>
        <a-entity light="type: directional; intensity: 0.9" position="1 3 1"></a-entity>
        
        <!-- Модель (скрыта до обнаружения плоскости) -->
        <a-entity id="model-container" visible="false">
            <a-entity id="ar-model" position="0 0.3 0"
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
                <a-octahedron color="#4ECDC4" radius="0.3"></a-octahedron>
                <a-cone color="#FF6B6B" radius-bottom="0.15" height="0.5" position="0 0.55 0"></a-cone>
                <a-torus color="#FFE66D" radius="0.15" radius-tubular="0.05"
                         position="0 -0.4 0" rotation="90 0 0"></a-torus>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        const sceneEl = document.querySelector('a-scene');
        const hint = document.getElementById('hint');
        const modelContainer = document.getElementById('model-container');

        let hitTestSource = null;
        let xrViewerSpace = null;
        let modelPlaced = false;
        let xrFrameHandle = null;

        // -------- Вход в AR-сессию --------
        sceneEl.addEventListener('enter-vr', async () => {
            if (!sceneEl.is('ar-mode')) return; // только для AR, не VR

            hint.style.display = 'block';
            modelPlaced = false;

            const session = sceneEl.renderer.xr.getSession();
            if (!session) return;

            try {
                xrViewerSpace = await session.requestReferenceSpace('viewer');

                // Запрашиваем hit-test
                const source = await session.requestHitTestSource({ space: xrViewerSpace });
                hitTestSource = source;

                // Подписываемся на кадры XR (НЕ перезаписываем setAnimationLoop!)
                session.requestAnimationFrame(onXRFrame);

            } catch (err) {
                console.error('Ошибка hit-test:', err);
            }
        });

        // -------- Выход из AR --------
        sceneEl.addEventListener('exit-vr', () => {
            if (hitTestSource) {
                hitTestSource.cancel();
                hitTestSource = null;
            }
            hitTestSource = null;
            xrViewerSpace = null;
            modelPlaced = false;

            hint.style.display = 'none';
            hint.style.opacity = '1';

            modelContainer.setAttribute('visible', false);
        });

        // -------- Цикл обработки XR-кадров --------
        function onXRFrame(time, frame) {
            const session = frame.session;
            // Планируем следующий кадр
            session.requestAnimationFrame(onXRFrame);

            if (!hitTestSource || modelPlaced) return;

            const refSpace = sceneEl.renderer.xr.getReferenceSpace();
            if (!refSpace) return;

            const results = frame.getHitTestResults(hitTestSource);
            if (results.length > 0) {
                const pose = results[0].getPose(refSpace);
                if (pose) {
                    // Ставим модель на найденную плоскость
                    modelContainer.object3D.matrixAutoUpdate = false;
                    modelContainer.object3D.matrix.fromArray(pose.transform.matrix);
                    modelContainer.setAttribute('visible', true);

                    modelPlaced = true;

                    hint.textContent = '✓ Модель закреплена';
                    setTimeout(() => { hint.style.opacity = '0'; }, 1800);
                }
            }
        }
    </script>
</body>
</html>
