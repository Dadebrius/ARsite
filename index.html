<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR-сцена A-Frame</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }

        #hint {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 12px 22px;
            border-radius: 22px;
            z-index: 9999;
            font-size: 15px;
            display: none;
            pointer-events: none;
            white-space: nowrap;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <div id="hint">Наведите камеру на ровную поверхность...</div>

    <!--
        xr-mode-ui="XRMode: ar" — включает кнопку AR в правом нижнем углу.
        webxr — просим hit-test и local-floor у браузера.
        background="transparent: true" + alpha: true — чтобы камера была видна.
    -->
    <a-scene
        renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true;"
        xr-mode-ui="XRMode: ar; enabled: true"
        webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: dom-overlay;"
        background="transparent: true">

        <!-- Освещение -->
        <a-entity light="type: ambient; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; intensity: 1; position: 1 3 1"></a-entity>

        <!--
            Вся ваша сцена — внутри одной группы.
            Группа изначально невидима. Как только hit-test найдёт плоскость —
            переместим группу туда и покажем.
            Масштаб 0.5, чтобы сцена была компактнее и помещалась на столе.
        -->
        <a-entity id="ar-root" visible="false" scale="0.5 0.5 0.5">

            <!-- Ваши объекты (из оригинального кода) -->
            <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
            <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
            <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
            <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>

            <!-- Небо убрали: в AR оно бы перекрыло камеру.
                 Если нужно — замените на a-sky с opacity 0.3 или оставьте полупрозрачную сферу. -->

        </a-entity>
    </a-scene>

    <script>
        const sceneEl = document.querySelector('a-scene');
        const hint    = document.getElementById('hint');
        const arRoot  = document.getElementById('ar-root');

        let hitTestSource = null;
        let viewerSpace   = null;
        let localFloor    = null;
        let modelPlaced   = false;
        let frameCount    = 0;

        // ---- Вход в AR (кнопка A-Frame сама вызывает requestSession) ----
        sceneEl.addEventListener('enter-vr', async () => {
            if (!sceneEl.is('ar-mode')) return;

            console.log('✅ enter-vr: AR-сессия началась');
            hint.style.display = 'block';
            hint.style.opacity = '1';
            modelPlaced = false;
            frameCount  = 0;

            const session = sceneEl.renderer.xr.getSession();
            if (!session) { console.error('❌ Нет XR-сессии'); return; }

            try {
                viewerSpace = await session.requestReferenceSpace('viewer');
                localFloor  = await session.requestReferenceSpace('local-floor');
                console.log('✅ Reference spaces получены');

                hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
                console.log('✅ hitTestSource создан');

                session.requestAnimationFrame(onXRFrame);
            } catch (err) {
                console.error('❌ Ошибка инициализации AR:', err);
            }
        });

        // ---- Выход из AR ----
        sceneEl.addEventListener('exit-vr', () => {
            console.log('👋 exit-vr');
            if (hitTestSource) { hitTestSource.cancel(); hitTestSource = null; }
            viewerSpace = null;
            localFloor  = null;
            modelPlaced = false;

            hint.style.display = 'none';
            arRoot.setAttribute('visible', false);
        });

        // ---- Цикл XR: ищем плоскость и ставим туда сцену ----
        function onXRFrame(time, frame) {
            frame.session.requestAnimationFrame(onXRFrame);
            frameCount++;

            if (!hitTestSource || !localFloor || modelPlaced) return;

            const results = frame.getHitTestResults(hitTestSource);

            if (frameCount % 30 === 0) {
                console.log('📊 frame', frameCount, '| hits:', results.length);
            }

            if (results.length > 0) {
                const pose = results[0].getPose(localFloor);
                if (!pose) return;

                console.log('🎯 Плоскость найдена, размещаем сцену');

                // Разбираем матрицу на позицию / поворот / масштаб
                const m = new THREE.Matrix4().fromArray(pose.transform.matrix);
                const pos = new THREE.Vector3();
                const quat = new THREE.Quaternion();
                const scl = new THREE.Vector3();
                m.decompose(pos, quat, scl);

                const obj = arRoot.object3D;
                obj.position.copy(pos);
                obj.quaternion.copy(quat);
                // Масштаб оставляем свой (0.5), а не из pose — иначе сцена «сплющится»
                obj.updateMatrix();
                obj.updateMatrixWorld(true);

                arRoot.setAttribute('visible', true);
                modelPlaced = true;

                hint.textContent = '✓ Сцена закреплена на плоскости';
                setTimeout(() => { hint.style.opacity = '0'; }, 1800);
            }
        }
    </script>
</body>
</html>
